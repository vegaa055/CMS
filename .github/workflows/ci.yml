name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    env:
      # Static checks don't need real secrets.
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  integration:
    name: Integration + E2E (ephemeral Neon branch)
    needs: checks
    runs-on: ubuntu-latest
    # Runs once the repo has NEON_API_KEY (secret) and NEON_PROJECT_ID (variable).
    if: vars.NEON_PROJECT_ID != ''
    timeout-minutes: 20
    env:
      CI: "true"
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      STORAGE_DRIVER: local
      # Emails go to ./.emails, where the e2e tests read their links.
      EMAIL_DRIVER: console
      BRANCH_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Create database branch from the empty ci-base
        id: neon
        run: |
          npx -y neonctl@6 branches create --project-id "$NEON_PROJECT_ID" \
            --name "$BRANCH_NAME" --parent ci-base --output json > /dev/null
          # Mark it right away so the cleanup step runs even if a later
          # command here fails.
          echo "created=true" >> "$GITHUB_OUTPUT"
          url=$(npx -y neonctl@6 connection-string "$BRANCH_NAME" \
            --project-id "$NEON_PROJECT_ID" --database-name folio --pooled)
          echo "::add-mask::$url"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"
          secret=$(openssl rand -base64 32)
          echo "::add-mask::$secret"
          echo "BETTER_AUTH_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Migrate (from empty) and seed
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Integration tests
        run: npm run test:int

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Delete database branch
        if: always() && steps.neon.outputs.created == 'true'
        # Retried with backoff: a transient Neon API error once left a branch
        # behind. Succeeds as soon as the branch is confirmed gone.
        run: |
          gone() {
            npx -y neonctl@6 branches list --project-id "$NEON_PROJECT_ID" \
              --output json | jq -e --arg name "$BRANCH_NAME" \
              '(.branches? // .) | map(select(.name == $name)) | length == 0' \
              > /dev/null
          }
          for attempt in 1 2 3 4; do
            npx -y neonctl@6 branches delete "$BRANCH_NAME" \
              --project-id "$NEON_PROJECT_ID" && exit 0
            gone && exit 0
            echo "Delete failed (attempt $attempt); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::Neon branch $BRANCH_NAME was not deleted"
          exit 1
